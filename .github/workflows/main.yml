name: "تصدير لعبة قودوت للويب مضمون"
on: [push, pull_request]

jobs:
  export_web:
    name: Build Web HTML5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and Templates
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          # تحميل المحرك
          wget -q https://github.com
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          
          # تحميل وفك القوالب الرسمية في المسار الصحيح تماماً
          wget -q https://github.com
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d templates_extract
          mv templates_extract/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates_extract Godot_v4.3-stable_export_templates.tpz Godot_v4.3-stable_linux.x86_64.zip

      - name: Extract Project Smartly
        run: |
          mkdir -p game_files
          unzip -q *.zip -d game_files || true
          cd game_files
          GODOT_DIR=$(find . -name "project.godot" -exec dirname {} \;)
          cd "$GODOT_DIR"
          
          # إنشاء إعدادات تصدير الويب النظيفة
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="index.html"
          EOF
          
          # بناء اللعبة باستخدام المحرك والقوالب المجهزة يدويًا
          mkdir -p ../../build
          ../../godot --headless --export-release "Web" ../../build/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-web-game
          path: build/
          
