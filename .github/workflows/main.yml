name: "تصدير لعبة قودوت 4 للهاتف"
on: [push, pull_request]

jobs:
  export_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip BaytAlGhaba_mobile.zip || true
          unzip */BaytAlGhaba_mobile.zip || true
          find . -name "project.godot"

      - name: Force Create Export Presets
        run: |
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="build/android/mygame.apk"
          encryption/encrypt_pck=false
          encryption/encrypt_directory=false
          
          [preset.0.options]
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.forest.house"
          package/name="Forest House"
          package/signed=false
          EOF

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/mygame.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: build/android/mygame.apk
          
