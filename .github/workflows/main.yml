name: "تصدير لعبة قودوت 4 للهاتف"
on: [push, pull_request]

jobs:
  export_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Unzip Project Files
        run: |
          unzip BaytAlGhaba_mobile.zip
          rm BaytAlGhaba_mobile.zip

      - name: Download Godot
        run: |
          wget https://github.com
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Export Templates
        run: |
          wget https://github.com
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d templates_extract
          mv templates_extract/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates_extract Godot_v4.3-stable_export_templates.tpz

      - name: Build APK
        run: |
          mkdir -p build/android
          ./godot --headless --export-release "Android" build/android/mygame.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: build/android/mygame.apk
          
