name: "تصدير لعبة قودوت 4 للويب"
on: [push, pull_request]

jobs:
  export_web:
    name: Build Web HTML5
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project Smartly
        run: |
          mkdir -p game_files
          unzip -q *.zip -d game_files || true
          cd game_files
          GODOT_DIR=$(find . -name "project.godot" -exec dirname {} \;)
          cd "$GODOT_DIR"
          
          # إنشاء إعدادات تصدير الويب تلقائياً
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="index.html"
          EOF
          
          # بناء اللعبة بصيغة الويب
          mkdir -p ../../build
          godot --headless --export-release "Web" ../../build/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-web-game
          path: build/
          
