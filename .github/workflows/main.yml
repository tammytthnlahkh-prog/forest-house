name: "تصدير لعبة قودوت 4 للهاتف"
on: [push, pull_request]

jobs:
  export_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project Smartly
        run: |
          mkdir -p game_files
          unzip -q *.zip -d game_files || true
          cd game_files
          GODOT_DIR=$(find . -name "project.godot" -exec dirname {} \;)
          echo "Project found in: $GODOT_DIR"
          cd "$GODOT_DIR"
          
          # إنشاء ملف الإعدادات إجبارياً في المسار الصحيح
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="mygame.apk"
          encryption/encrypt_pck=false
          encryption/encrypt_directory=false
          
          [preset.0.options]
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.forest.house"
          package/name="Forest House"
          package/signed=false
          EOF
          
          # إجبار وضع قوالب التصدير في كل المسارات المتوقعة للحاوية
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/4.3.stable/ || true
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/templates/4.3.stable/ || true
          
          # بناء اللعبة
          mkdir -p ../../build
          godot --headless --export-release "Android" ../../build/mygame.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: build/mygame.apk
          
